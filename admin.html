<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audicords Admin Chat</title>
<style>
body{margin:0;font-family:Arial;background:#f4f1e9}
header{background:#131c30;color:white;padding:20px;font-size:20px;font-weight:bold}
main{max-width:800px;margin:auto;padding:15px}
.card{background:white;padding:15px;margin-bottom:15px;border-radius:10px}
.email{color:#777;font-size:12px;margin:5px 0 12px}
.visitor{background:#f4f1e9;padding:10px;border-radius:7px}
.reply{background:#c31432;color:white;padding:10px;border-radius:7px;margin-top:8px}
textarea{width:100%;height:65px;margin-top:10px;padding:10px;box-sizing:border-box}
button{margin-top:7px;padding:10px 18px;background:#c31432;color:white;border:0;border-radius:6px;font-weight:bold}
</style>
</head>
<body>

<header>Audicords — Live Chat Inbox</header>
<main id="box">Loading...</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const URL="https://vajgazaroqefeuurfcnx.supabase.co";
const KEY="sb_publishable_UQ9_b-WTCG1YyTRZasS8SQ_5WFmWyHV";
const db=supabase.createClient(URL,KEY);
const box=document.getElementById("box");

async function load(){
const {data,error}=await db.from("messages")
.select("*").order("created_at",{ascending:false});

if(error){box.textContent=error.message;return}

box.innerHTML="";

if(!data.length){box.innerHTML="<p>No messages yet.</p>";return}

data.forEach(x=>{
let d=document.createElement("div");
d.className="card";
d.innerHTML=`
<b>${safe(x.name)}</b>
<div class="email">${safe(x.email)}</div>
<div class="visitor">${safe(x.message)}</div>
${x.reply?`<div class="reply">${safe(x.reply)}</div>`:""}
<textarea id="r${x.id}" placeholder="Write reply..."></textarea>
<button onclick="reply(${x.id})">Send Reply</button>`;
box.appendChild(d);
});
}

async function reply(id){
let text=document.getElementById("r"+id).value.trim();
if(!text)return;

const {error}=await db.from("messages").update({
reply:text,replied_at:new Date().toISOString()
}).eq("id",id);

if(error)alert(error.message);
else load();
}

function safe(x){
return String(x||"").replace(/[&<>"']/g,m=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
}[m]));
}

load();
setInterval(load,5000);
</script>
</body>
</html>
